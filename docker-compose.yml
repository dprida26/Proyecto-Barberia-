services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberops
      POSTGRES_PASSWORD: barberops
      POSTGRES_DB: barberops
    ports:
      - "5434:5432"
    volumes:
      - barberops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: America/Asuncion
      CORS_ORIGIN: http://localhost:3010
      DATABASE_URL: postgresql://barberops:barberops@postgres:5432/barberops
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
    ports:
      - "3011:3001"
    volumes:
      - barberops_uploads:/repo/packages/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3011
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3010:3000"

volumes:
  barberops_postgres_data:
  barberops_uploads:
