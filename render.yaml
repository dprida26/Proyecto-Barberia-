databases:
  - name: titi-barberia-db
    plan: free
    databaseName: barberops
    user: barberops

services:
  - type: web
    name: titi-barberia-api
    runtime: docker
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: TZ
        value: America/Asuncion
      - key: DATABASE_URL
        fromDatabase:
          name: titi-barberia-db
          property: connectionString
      # URL publica del servicio web (fija, ver nota en README de deploy).
      - key: CORS_ORIGIN
        value: https://titi-barberia-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Cloudflare R2 (logo del negocio) -- completar a mano en el dashboard
      # de Render despues de crear el bucket. Sin estos valores el logo se
      # guarda en el filesystem del contenedor, que Render borra en cada
      # deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  - type: web
    name: titi-barberia-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Render traduce automaticamente los envVars de un servicio Docker en
      # ARGs disponibles durante el build de la imagen. NEXT_PUBLIC_API_URL
      # se hornea en el bundle de Next.js en build time, por eso va fijo con
      # el nombre exacto del servicio api de arriba (Blueprint no permite
      # referenciar la URL publica de otro servicio dinamicamente).
      - key: NEXT_PUBLIC_API_URL
        value: https://titi-barberia-api.onrender.com
